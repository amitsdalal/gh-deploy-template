# PM2 process definition.
#
# `script` points at the launcher, NOT at Next's binary with args -- see the
# comment in pm2-next.js for why that matters.
apps:
  - name: web
    script: pm2-next.js
    exec_mode: cluster
    instances: 2          # raise only if the host has the RAM for it
    merge_logs: true
    autorestart: true
    max_memory_restart: 1G
    env:
      NODE_ENV: production
    env_production:
      NODE_ENV: production

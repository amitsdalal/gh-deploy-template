# Proxy sidecar that sits in front of the app container.
#
# Kept minimal on purpose: TLS, redirects and legacy rewrites belong on the
# host's web server (see docs/host-vhost.conf.example), not in here.
server {
    listen 80;

    proxy_buffers     8 16k;
    proxy_buffer_size 32k;

    # Next emits content-hashed assets here; they are immutable.
    location /_next/static/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;

        # without these Next builds canonical URLs from the internal address
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
    }
}

# Proxy sidecar that sits in front of the app container.
#
# Kept minimal on purpose: TLS, redirects and legacy rewrites belong on the
# host's web server (see docs/host-vhost.conf.example), not in here.
# Resolve the app container at REQUEST time, not at config-load time.
#
# nginx resolves a literal hostname in proxy_pass while parsing the config and
# exits with "host not found in upstream" if it cannot. In compose that means
# the proxy dies whenever the app container is briefly absent -- during a
# deploy, or after a daemon restart -- and then crash-loops forever even once
# the app is healthy again. A variable defers resolution to each request, so the
# proxy starts regardless and recovers on its own (serving 502 meanwhile).
#
# 127.0.0.11 is Docker's embedded DNS on user-defined networks.
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;

    # must be a variable, or nginx resolves at startup again
    set $app_host web;

    proxy_buffers     8 16k;
    proxy_buffer_size 32k;

    # Next emits content-hashed assets here; they are immutable.
    location /_next/static/ {
        proxy_pass http://$app_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://$app_host:3000;
        proxy_http_version 1.1;

        # without these Next builds canonical URLs from the internal address
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
    }
}
